[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "webdatastream"
version = "0.1.0"
description = "Checkpointable, prefetched WebDataset shards for PyTorch"
requires-python = ">=3.10"
dependencies = ["torch>=2.1", "fsspec>=2024.2"]

[project.optional-dependencies]
cache = ["speechbrain>=1.0", "tensordict>=0.5", "cloudpickle>=2.2"]
audio = ["soundfile>=0.12"]
cli = ["click>=8.1", "numpy>=1.24", "soundfile>=0.12"]

[project.scripts]
webdatastream = "webdatastream.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
